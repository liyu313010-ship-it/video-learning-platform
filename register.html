<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 在线视频学习平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center px-4">
    <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-8">新用户注册</h2>
        <form class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
                <input type="tel" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="请输入手机号">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">验证码</label>
                <div class="flex gap-3">
                    <input type="text" class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="请输入验证码">
                    <button type="button" class="flex-shrink-0 px-4 py-2 bg-gray-200 text-gray-600 rounded-lg hover:bg-gray-300 transition text-sm">
                        获取验证码
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">设置密码</label>
                <input type="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="请设置6-18位密码">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
                <input type="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="请再次输入密码">
            </div>

            <div class="flex items-center text-sm">
                <label class="flex items-center gap-2 text-gray-600">
                    <input type="checkbox" required class="rounded text-blue-600 accent-blue-600"> 
                    我已阅读并同意 <a href="#" class="text-blue-600 hover:underline ml-1">《用户注册协议》</a>
                </label>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">注 册</button>
        </form>
        <div class="mt-6 text-center text-sm text-gray-500">
            已有账号？ <a href="login.html" class="text-blue-600 font-bold">立即登录</a>
        </div>
    </div>
</body>
</html>
