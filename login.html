<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 在线视频学习平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center px-4">
    <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-8">欢迎回来</h2>
        <form class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">账号 / 手机号</label>
                <input type="text" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="请输入账号">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                <input type="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="请输入密码">
            </div>
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2">
                    <input type="checkbox" class="rounded text-blue-600"> 记住我
                </label>
                <a href="#" class="text-blue-600">忘记密码？</a>
            </div>
            <a href="index.html" class="block w-full bg-blue-600 text-white text-center py-2 rounded-lg font-bold hover:bg-blue-700 transition">登 录</a>
        </form>
        <div class="mt-6 text-center text-sm text-gray-500">
            还没有账号？ <a href="register.html" class="text-blue-600 font-bold">立即注册</a>
        </div>
    </div>
</body>
</html>
