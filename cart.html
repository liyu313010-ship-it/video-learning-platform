<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 在线视频学习平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <nav class="bg-white shadow-md fixed w-full z-50 top-0">
        <div class="container mx-auto px-4 h-16 flex justify-between items-center">
            <div class="text-2xl font-bold text-blue-600">未来代码院线</div>
            <div class="hidden md:flex space-x-8">
                <a href="index.html" class="hover:text-blue-600 transition">首页</a>
                <a href="course-list.html" class="hover:text-blue-600 transition">课程列表</a>
                <a href="#" class="hover:text-blue-600 transition">活动</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="cart.html" class="text-blue-600 font-medium">购物车</a>
                <a href="login.html" class="px-4 py-2 text-blue-600 border border-blue-600 rounded-lg hover:bg-blue-50 transition">登录</a>
                <a href="user-center.html" class="hidden md:block w-8 h-8 rounded-full bg-gray-200 overflow-hidden">
                    <img src="images/头像.jpg" alt="Avatar" class="w-full h-full object-cover">
                </a>
            </div>
        </div>
    </nav>
    <div class="container mx-auto px-4 mt-16">
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="hidden md:grid grid-cols-6 gap-4 p-4 bg-gray-100 font-bold text-sm">
                <div class="col-span-3">课程信息</div>
                <div class="text-center">单价</div>
                <div class="text-center">操作</div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-6 gap-4 p-4 border-b items-center">
                <div class="col-span-3 flex gap-4">
                    <img src="https://placehold.co/120x80" alt="Vue3课程封面" class="rounded object-cover">
                    <div>
                        <div class="font-bold">Vue3 全栈开发</div>
                        <div class="text-sm text-gray-500 mt-1">永久有效</div>
                    </div>
                </div>
                <div class="flex justify-between md:justify-center md:block">
                    <span class="md:hidden text-gray-500">价格：</span>
                    <span class="font-bold">¥ 199.00</span>
                </div>
                <div class="text-center text-red-500 cursor-pointer hover:underline">删除</div>
            </div>
        </div>
        <div class="mt-6 bg-white p-4 rounded-lg shadow flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-sm text-gray-500">已选 1 门课程</div>
            <div class="flex items-center gap-4">
                <div class="text-lg">合计: <span class="text-red-500 font-bold text-2xl">¥ 199.00</span></div>
                <a href="buy.html" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700">去结算</a>
            </div>
        </div>
    </div>
</body>
</html>
