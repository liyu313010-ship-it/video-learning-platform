<!DOCTYPE html>

</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
    <nav class="bg-white shadow-md fixed w-full z-50 top-0">
        <div class="container mx-auto px-4 h-16 flex justify-between items-center">
            <div class="text-2xl font-bold text-blue-600">未来代码院线</div>
            <div class="hidden md:flex space-x-8">
                <a href="index.html" class="hover:text-blue-600 transition">首页</a>
                <a href="course-list.html" class="text-blue-600 font-medium">课程列表</a>
                <a href="#" class="hover:text-blue-600 transition">活动</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="cart.html" class="hover:text-blue-600">购物车</a>
                <a href="login.html" class="px-4 py-2 text-blue-600 border border-blue-600 rounded-lg hover:bg-blue-50 transition">登录</a>
                <a href="user-center.html" class="hidden md:block w-8 h-8 rounded-full bg-gray-200 overflow-hidden">
                    <img src="images/头像.jpg" alt="Avatar" class="w-full h-full object-cover">
                </a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 mt-16 flex flex-col md:flex-row gap-6">
        
        <aside class="w-full md:w-1/4 lg:w-1/5 flex-shrink-0">
            <div class="bg-white p-4 rounded-lg shadow mb-4">
                <h3 class="font-bold mb-4 text-lg">全部分类</h3>
                <ul class="space-y-2 text-sm">
                    <li class="p-2 bg-blue-50 text-blue-600 rounded cursor-pointer font-medium">全部课程</li>
                    <li class="p-2 hover:bg-gray-50 rounded cursor-pointer">前端开发</li>
                    <li class="p-2 hover:bg-gray-50 rounded cursor-pointer">后端开发</li>
                    <li class="p-2 hover:bg-gray-50 rounded cursor-pointer">移动端</li>
                    <li class="p-2 hover:bg-gray-50 rounded cursor-pointer">数据库</li>
                </ul>
            </div>
        </aside>

        <main class="w-full md:w-3/4 lg:w-4/5">
            <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap justify-between items-center gap-4">
                <div class="flex space-x-4 text-sm">
                    <button class="text-blue-600 font-bold">综合排序</button>
                    <button class="text-gray-500 hover:text-blue-600">销量 ↓</button>
                    <button class="text-gray-500 hover:text-blue-600">价格 ⇅</button>
                </div>
                <div class="text-sm text-gray-500">共找到 120 门课程</div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <a href="course-detail.html" class="bg-white rounded-lg shadow hover:shadow-lg transition flex flex-col">
                    <img src="https://placehold.co/400x250" class="w-full h-40 object-cover rounded-t-lg" alt="课程封面">
                    <div class="p-3 flex-1 flex flex-col">
                        <h4 class="font-bold mb-2 line-clamp-2">React 18 核心原理解析与实战应用</h4>
                        <div class="mt-auto">
                            <div class="text-xs text-gray-500 mb-2">讲师：王老师 · 已售 300</div>
                            <div class="text-red-500 font-bold">¥ 129.00</div>
                        </div>
                    </div>
                </a>
                
                <a href="course-detail.html" class="bg-white rounded-lg shadow hover:shadow-lg transition flex flex-col"><img src="images/vue3+ts.png" class="w-full h-40 object-cover rounded-t-lg" alt="Vue3课程封面"><div class="p-3"><h4 class="font-bold mb-2">Vue3 + TS 全栈开发实战</h4><div class="text-xs text-gray-500 mb-2">讲师：张三 · 已售 1.2k</div><div class="text-red-500 font-bold">¥ 199.00</div></div></a>
                <a href="course-detail-python.html" class="bg-white rounded-lg shadow hover:shadow-lg transition flex flex-col"><img src="images/python.jpg" class="w-full h-40 object-cover rounded-t-lg" alt="Python课程封面"><div class="p-3"><h4 class="font-bold mb-2">Python 从入门到实践</h4><div class="text-xs text-gray-500 mb-2">讲师：李四 · 已售 800</div><div class="text-red-500 font-bold">¥ 99.00</div></div></a>
                <a href="course-detail-ui-ux.html" class="bg-white rounded-lg shadow hover:shadow-lg transition flex flex-col"><img src="images/ui_ux.png" class="w-full h-40 object-cover rounded-t-lg" alt="UI/UX课程封面"><div class="p-3"><h4 class="font-bold mb-2">UI/UX 设计系统课</h4><div class="text-xs text-gray-500 mb-2">讲师：王五 · 已售 2.1k</div><div class="text-red-500 font-bold">¥ 299.00</div></div></a>
            </div>

            <div class="mt-8 flex justify-center space-x-2">
                <button class="px-3 py-1 border rounded hover:bg-gray-100">上一页</button>
                <button class="px-3 py-1 bg-blue-600 text-white rounded">1</button>
                <button class="px-3 py-1 border rounded hover:bg-gray-100">2</button>
                <button class="px-3 py-1 border rounded hover:bg-gray-100">下一页</button>
            </div>
        </main>
    </div>
</body>
</html>
