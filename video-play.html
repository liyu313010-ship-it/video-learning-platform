<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">
    <nav class="bg-gray-800 border-b border-gray-700 h-14 flex items-center px-4 justify-between flex-shrink-0">
        <div class="flex items-center gap-4">
            <a id="back-link" href="course-detail.html" class="text-gray-400 hover:text-white">← 返回</a>
            <h1 id="video-title" class="font-medium truncate max-w-[200px] md:max-w-md">1-1 课程简介与学习指南</h1>
        </div>
        <div class="text-sm text-gray-400">EduPlayer</div>
    </nav>

    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <div class="flex-1 flex flex-col bg-black relative">
            <div class="flex-1 relative flex items-center justify-center">
                <video id="video-player" class="w-full aspect-video bg-gray-800" controls>
                    <source id="video-source" src="videos/default.mp4" type="video/mp4">
                    您的浏览器不支持HTML5视频播放。
                </video>
            </div>
            

        </div>

        <div class="w-full md:w-80 bg-gray-800 border-l border-gray-700 flex flex-col overflow-y-auto">
            <div class="p-4 border-b border-gray-700 font-bold">课程目录</div>
            <ul id="course-chapters" class="flex-1">
                <!-- 课程章节将通过JavaScript动态加载 -->
            </ul>
        </div>
    </div>

    <script>
        // 获取URL参数
        const urlParams = new URLSearchParams(window.location.search);
        const course = urlParams.get('course') || 'vue3-ts';
        const chapter = urlParams.get('chapter') || '1-1';
        
        // 课程视频数据
        const courseVideos = {
            'vue3-ts': {
                title: 'Vue3 + TS 全栈开发实战',
                backLink: 'course-detail.html',
                chapters: [
                    { id: '1-1', title: '课程简介与学习指南', duration: '12:30', video: 'videos/vue3-ts/1-1.mp4' },
                    { id: '1-2', title: '环境搭建', duration: '10:20', video: 'videos/vue3-ts/1-2.mp4' },
                    { id: '1-3', title: '第一个Vue3程序', duration: '15:45', video: 'videos/vue3-ts/1-3.mp4' }
                ]
            },
            'python': {
                title: 'Python 从入门到实践',
                backLink: 'course-detail-python.html',
                chapters: [
                    { id: '1-1', title: 'Python介绍和环境搭建', duration: '8:45', video: 'videos/python/1-1.mp4' },
                    { id: '1-2', title: '第一个Python程序', duration: '12:30', video: 'videos/python/1-2.mp4' },
                    { id: '1-3', title: '数据类型和变量', duration: '15:20', video: 'videos/python/1-3.mp4' }
                ]
            },
            'ui-ux': {
                title: 'UI/UX 设计系统课',
                backLink: 'course-detail-ui-ux.html',
                chapters: [
                    { id: '1-1', title: 'UI/UX设计概念和区别', duration: '15:20', video: 'videos/ui-ux/1-1.mp4' },
                    { id: '1-2', title: '设计原则和用户体验要素', duration: '18:45', video: 'videos/ui-ux/1-2.mp4' },
                    { id: '1-3', title: '设计工具介绍和Figma基础', duration: '20:15', video: 'videos/ui-ux/1-3.mp4' }
                ]
            },
            'docker': {
                title: 'Docker 容器化部署',
                backLink: 'course-detail-docker.html',
                chapters: [
                    { id: '1-1', title: 'Docker介绍和安装', duration: '14:30', video: 'videos/docker/1-1.mp4' },
                    { id: '1-2', title: 'Docker核心概念和架构', duration: '16:50', video: 'videos/docker/1-2.mp4' },
                    { id: '1-3', title: '第一个Docker容器', duration: '11:20', video: 'videos/docker/1-3.mp4' }
                ]
            }
        };
        
        // 初始化页面
        function initVideoPlayer() {
            const courseData = courseVideos[course] || courseVideos['vue3-ts'];
            const currentChapter = courseData.chapters.find(ch => ch.id === chapter) || courseData.chapters[0];
            
            // 更新返回链接
            document.getElementById('back-link').href = courseData.backLink;
            
            // 更新视频标题
            document.getElementById('video-title').textContent = `${currentChapter.title} - ${courseData.title}`;
            
            // 更新视频源
            document.getElementById('video-source').src = currentChapter.video;
            document.getElementById('video-player').load();
            
            // 生成课程章节列表
            const chaptersList = document.getElementById('course-chapters');
            chaptersList.innerHTML = '';
            
            courseData.chapters.forEach(ch => {
                const li = document.createElement('li');
                li.className = `p-3 cursor-pointer border-l-4 transition-all duration-200 ${
                    ch.id === chapter ? 'bg-gray-700 border-blue-500 text-blue-300' : 'hover:bg-gray-700 border-transparent text-gray-300'
                }`;
                
                const chapterLink = document.createElement('a');
                chapterLink.href = `?course=${course}&chapter=${ch.id}`;
                chapterLink.className = 'block';
                
                const chapterTitle = document.createElement('div');
                chapterTitle.className = 'text-sm';
                chapterTitle.textContent = ch.id + ' ' + ch.title;
                
                const chapterMeta = document.createElement('div');
                chapterMeta.className = 'text-xs text-gray-500 mt-1';
                chapterMeta.textContent = ch.duration + (ch.id === chapter ? ' | 正在播放' : '');
                
                chapterLink.appendChild(chapterTitle);
                chapterLink.appendChild(chapterMeta);
                li.appendChild(chapterLink);
                chaptersList.appendChild(li);
            });
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initVideoPlayer);
    </script>
</body>
</html>
